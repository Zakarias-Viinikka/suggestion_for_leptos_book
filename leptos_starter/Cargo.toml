[workspace]
resolver = "3"
members = [
    "animation/background_dots",
    "animation/simple_example",
    "effects/one_shot",
    "effects/on_signal_change",
    "effects/on_signal_change_2",
    "final_example",
    "for_enumerate/basic_example",
    "for_enumerate/list_of_reactive_components",
    "html_elements",
    "per_page_linking",
    "routing/r1_basic_routing",
    "routing/r2_folder_routing",
    "routing/r3_routing_w_signals",
    "routing/r4_optional_signals",
    "rust_js/rj1_calling_js_from_rust",
    "rust_js/rj2_js_accesses_signals",
    "rust_js/rj3_cleaner_code",
    "signals/memo",
    "callback",
    "sort_this_later/control_css",
    "sort_this_later/localstorage",
    "sort_this_later/loop_macros",
    "sort_this_later/show_component",
    "specific_ui_elements/checkbox",
    "specific_ui_elements/checkbox2",
    "state_flow/lz_lock",
    "state_flow/once_lock",
    "download_as_file",
    "download_as_file",
    "global_files",
    "css_examples/install_css_via_component", "hotkeys",
]

[workspace.dependencies]
anyhow = "1.0.103"
console_error_panic_hook = "0.1.7"
gloo-timers = "0.4.0"
js-sys = "0.3.103"
leptos = { version = "0.8.19", features = ["csr"] }
leptos_meta = "0.8.6"
leptos_router = "0.8.13"
leptos-use = { version = "0.19.0", features = ["use_textarea_autosize", "storage"] }
rand = "0.10.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tw_merge = "0.1.21"
wasm-bindgen = "0.2.126"
wasm-bindgen-test = "0.3.76"
web-sys = { version = "0.3.103", features = ["DragEvent", "Element", "HtmlElement", "DomTokenList", "NodeList", "DomRect", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Window"] }
codee = { version = "0.3.5", features = ["json_serde"] }

[patch.crates-io]
server_fn_macro = { path = "vendor/server_fn_macro" }
server_fn_macro_default = { path = "vendor/server_fn_macro_default" }
